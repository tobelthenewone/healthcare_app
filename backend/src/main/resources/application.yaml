spring:
  datasource:
    url: jdbc:h2:mem:healthcaredb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  h2:
    console:
      enabled: true
      path: /h2-console


# JWT Configuration
  jwt:
    secret: mySecretKeyForJWTTokens2024HealthcareApp
    expiration: 86400000 # 24 hours in milliseconds

  server:
    port: 8080

# Server configuration (optional)
server:
  port: 8080
  error:
    include-message: always

# Logging (optional but helpful)
logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE